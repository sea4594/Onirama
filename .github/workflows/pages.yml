name: GitHub Pages (solo + Firebase multiplayer)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run release:gate
      - name: Build standalone site and configure Firebase multiplayer
        env:
          ONIRAMA_FIREBASE_API_KEY: ${{ vars.ONIRAMA_FIREBASE_API_KEY }}
          ONIRAMA_FIREBASE_AUTH_DOMAIN: ${{ vars.ONIRAMA_FIREBASE_AUTH_DOMAIN }}
          ONIRAMA_FIREBASE_PROJECT_ID: ${{ vars.ONIRAMA_FIREBASE_PROJECT_ID }}
          ONIRAMA_FIREBASE_APP_ID: ${{ vars.ONIRAMA_FIREBASE_APP_ID }}
          ONIRAMA_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.ONIRAMA_FIREBASE_MESSAGING_SENDER_ID }}
          ONIRAMA_FIREBASE_STORAGE_BUCKET: ${{ vars.ONIRAMA_FIREBASE_STORAGE_BUCKET }}
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
